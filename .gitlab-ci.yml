# GitLab CI/CD pipeline for deploying Fabric item definitions with the
# Bulk Import Item Definitions API.
#
# Service principal credentials are supplied as environment-scoped CI/CD
# variables (Settings > CI/CD > Variables), one set per GitLab Environment:
#   FABRIC_TENANT_ID, FABRIC_CLIENT_ID, FABRIC_CLIENT_SECRET, FABRIC_WORKSPACE_NAME
# Mark FABRIC_CLIENT_SECRET as masked and protected.

stages:
  - validate
  - deploy_dev
  - deploy_test
  - deploy_prod

default:
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl jq ca-certificates >/dev/null
    - chmod +x scripts/*.sh

# Validate scripts and payload on every merge request and on main.
validate:
  stage: validate
  image: koalaman/shellcheck-alpine:stable
  environment:
    name: dev
    action: prepare
  before_script:
    - apk add --no-cache bash jq findutils coreutils >/dev/null
    - chmod +x scripts/*.sh scripts/lib/*.sh
  script:
    - shellcheck scripts/*.sh scripts/lib/*.sh
    - bash scripts/import_workspace.sh --env dev --source fabric --dry-run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Deploy to the development workspace automatically on main.
deploy:dev:
  stage: deploy_dev
  environment:
    name: dev
  script:
    - bash scripts/import_workspace.sh --env dev --source fabric
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Promote to test after a manual approval.
deploy:test:
  stage: deploy_test
  environment:
    name: test
  script:
    - bash scripts/import_workspace.sh --env test --source fabric
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: false

# Promote to production after a manual approval. Protect this environment.
deploy:prod:
  stage: deploy_prod
  environment:
    name: prod
  script:
    - bash scripts/import_workspace.sh --env prod --source fabric
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: false
